ld .status{display:inline-block}.panel:nth-child(2){border-top:22px solid #004578;padding:16px 14px;margin-top:10px}td:last-child{min-width:110px;white-space:nowrap}.alert-text{font-size:12px;font-weight:600}.alert-text.percent,.alert-text.missing,.alert-text.mismatch{color:#b42318}.alert-text.na{color:#666}.filter-head{position:relative;padding-right:0!important}.filter-head>span{display:inline-block;padding-right:9px}.funnel{float:right;background:#004578;border:0;border-left:1px solid #31668b;border-radius:0;padding:7px 9px;line-height:0}.funnel:hover,.funnel.filtered{background:#1688b7}.grid-filter-popup{position:fixed;z-index:1000;width:185px;box-sizing:border-box;padding:8px;background:#fafafa;border:1px solid #d4d4d4;box-shadow:0 3px 9px #0003;font:12px Arial,sans-serif;color:#555}.grid-filter-popup[hidden]{display:none}.grid-filter-popup .filter-caption{margin-bottom:6px}.grid-filter-popup select,.grid-filter-popup input{display:block;box-sizing:border-box;width:100%;min-width:0;margin-bottom:5px;padding:5px;font-size:12px;border:1px solid #ddd;border-radius:3px}.grid-filter-popup select{background:linear-gradient(white,#eee)}.filter-actions{display:flex;gap:6px}.filter-actions button{padding:5px 9px;font-size:12px}.filter-actions button:last-child{background:#eee;color:#444;border:1px solid #ddd}.normal-row td:nth-child(-n+5){color:#333!important}.alert-row td:nth-child(-n+5){color:#d21f25!important}.normal-row td:last-child{color:#333}.alert-row td:first-child{font-weight:500}.tag{display:inline-block;white-space:nowrap;text-align:center;box-sizing:border-box;margin:1px 2px 1px 0;padding:3px 5px}.tag:nth-of-type(1){min-width:72px}.tag:nth-of-type(2){min-width:72px}.tag:nth-of-type(3){min-width:113px}.tag:nth-of-type(4){min-width:48px}.tag:nth-of-type(5){min-width:58px}.tag:nth-of-type(6){min-width:68px}td:nth-child(6){min-width:560px;white-space:nowrap}.alert-row .alert-text{color:#c21b22}.role-caption{font-size:12px;line-height:19px;margin-right:5px}.tag:nth-of-type(1),.tag:nth-of-type(2){display:inline-flex;align-items:center;justify-content:center;width:88px;min-width:88px;max-width:88px;box-sizing:border-box;padding-left:2px;padding-right:2px;white-space:nowrap}td:nth-child(6){white-space:nowrap}th:last-child,td:last-child{width:225px;min-width:225px;max-width:225px;box-sizing:border-box;white-space:nowrap!important}td:last-child .alert-text{white-space:nowrap!important;display:inline-block}</style></head><body><header>Cost Center Maintenance <span style="font-size:12px;color:#666;float:right;margin-top:8px">互動 POC · 模擬資料</span></header><main class="wrap"><section class="panel"><div class="filters"><label>Year <select id="year"><option>2026</option><option>2025</option></select></label><label>Month <select id="month"><option>10</option><option>9</option><option>8</option></select></label><label style="display:none">Role <select id="role"><option value="all">All</option><option>RBU</option><option>SBU</option><option>RBU-Production</option><option>MSU</option><option>Others</option><option>No Rule</option></select></label><div class="role-radios"><strong class="role-caption">Role:</strong><label><input type="radio" name="roleChoice" value="all" checked> All</label><label><input type="radio" name="roleChoice" value="RBU"> RBU</label><label><input type="radio" name="roleChoice" value="RBU-Production"> RBU-Production</label><label><input type="radio" name="roleChoice" value="SBU"> SBU</label><label><input type="radio" name="roleChoice" value="MSU"> MSU</label><label><input type="radio" name="roleChoice" value="Others"> Others</label><label><input type="radio" name="roleChoice" value="No Rule"> No Rule</label></div><label>Alert Filter <select id="filter"><option value="all">不篩選警示</option><option value="issue">所有異常</option><option value="percent">比例異常</option><option value="missing">未設定 Rule</option><option value="mismatch">Category/Rule 設定不吻合</option></select></label><button id="reset">重設模擬資料</button><button type="button" id="syncDemo">模擬隔日 SAP 同步</button><span id="syncStatus" class="hint" aria-live="polite"></span></div></section><section class="panel"><div class="scroll"><table><thead><tr><th class="filter-head"><span>Control Area</span><button type="button" class="funnel" data-col="0" title="Filter Control Area" aria-label="Filter Control Area"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th><th class="filter-head"><span>Company Code</span><button type="button" class="funnel" data-col="1" title="Filter Company Code" aria-label="Filter Company Code"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th><th class="filter-head"><span>Cost Center</span><button type="button" class="funnel" data-col="2" title="Filter Cost Center" aria-label="Filter Cost Center"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th><th class="filter-head"><span>Fun Area</span><button type="button" class="funnel" data-col="3" title="Filter Fun Area" aria-label="Filter Fun Area"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th><th class="filter-head"><span>SAP Category</span><button type="button" class="funnel" data-col="4" title="Filter SAP Category" aria-label="Filter SAP Category"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th><th class="filter-head"><span>Role of Cost Center</span><button type="button" class="funnel" data-col="5" title="Filter Role of Cost Center" aria-label="Filter Role of Cost Center"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th><th class="filter-head"><span>Alert</span><button type="button" class="funnel" data-col="6" title="Filter Alert" aria-label="Filter Alert"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 3v-9z"/></svg></button></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="gridFilterPopup" class="grid-filter-popup" hidden><div class="filter-caption">Show items with value that:</div><select id="gridFilterOp"><option value="eq">Equal to</option><option value="neq">Not equal to</option><option value="contains">Contains</option><option value="starts">Starts with</option><option value="ends">Ends with</option></select><input id="gridFilterValue" type="text" autocomplete="off"><div class="filter-actions"><button type="button" id="gridFilterApply">Filter</button><button type="button" id="gridFilterClear">Clear</button></div></div><div class="modal" id="modal"><div class="dialog"><h3 id="dialogTitle"></h3><div class="sub" id="source"></div><div class="field"><label>RBU Percentage（外部來源，唯讀） <strong id="rbu"></strong></label></div><div class="field"><label>SBU Percentage（OPEX Role Setting） <input type="number" id="sbu" min="0" max="100" step="1" placeholder="未設定"></label></div><div class="field"><label><input type="checkbox" id="prod" disabled> RBU-Production</label></div><div class="field"><label><input type="checkbox" id="others" disabled> Others</label></div><div class="field"><label><input type="checkbox" id="norole"> No Rule（暫不設定；排除比例檢查及 OPEX Calculation）</label></div><div class="field"><label><input type="checkbox" id="msu" disabled> MSU（模擬 SAP Status）</label></div><div class="sub" id="ruleNote">SAP 對應的角色為唯讀；可調整 SBU Percentage 或切換 No Rule。此 POC 僅模擬 OPEX 排除狀態，尚未連接計算服務。</div><div id="preview" class="panel" style="background:#f7fafc;box-shadow:none"></div><div class="footer"><button class="secondary" id="cancel">取消</button><button id="save">儲存模擬設定</button></div></div></div><script>
const initial=[{id:'B9NPEI',category:'E',rbu:80,sbu:null,fun:'0500'},{id:'B7FIN',category:'E',rbu:50,sbu:50,fun:'0400'},{id:'B7HR',category:'E',rbu:50,sbu:100,fun:'0400'},{id:'B7IT',category:'E',rbu:50,sbu:null,fun:'0400'},{id:'B8QUA',category:'F',rbu:null,sbu:null,msu:true,fun:'0100'},{id:'B8LAB',category:'J',rbu:null,sbu:null,prod:true,fun:'0100'},{id:'US-DUMMY',category:'H',rbu:null,sbu:null,others:true,fun:'0400'},{id:'CC-NOROLE',category:'L',rbu:null,sbu:null,norole:true,fun:'0400'},{id:'CC-EMPTY',category:'E',rbu:null,sbu:null,fun:'0400'},{id:'CC-RBU100',category:'G',rbu:100,sbu:null,fun:'0400'},{id:'CC-RBU80',category:'G',rbu:80,sbu:null,fun:'0400'},{id:'CC-SBU100',category:'E',rbu:100,sbu:null,fun:'0500'},{id:'CC-MIX8020',category:'E',rbu:80,sbu:20,fun:'0500'},{id:'CC-MIX7030',category:'G',rbu:70,sbu:30,fun:'0400'},{id:'CC-UNDER',category:'E',rbu:60,sbu:20,fun:'0500'},{id:'CC-OVER',category:'G',rbu:70,sbu:60,fun:'0400'},{id:'CC-MSU-PROD',category:'F',rbu:null,sbu:null,prod:true,fun:'0100'},{id:'CC-PROD-MSU',category:'J',rbu:null,sbu:null,msu:true,fun:'0100'},{id:'CC-OTH-MSU',category:'H',rbu:null,sbu:null,msu:true,fun:'0400'},{id:'CC-MSU-OTH',category:'F',rbu:null,sbu:null,others:true,fun:'0100'},{id:'CC-RBU-NONE',category:'G',rbu:null,sbu:100,fun:'0400'},{id:'CC-SBU-NONE',category:'E',rbu:null,sbu:null,fun:'0500'}];
const map={E:['R&D','SBU'],F:['MSU Production','MSU'],G:['Logistics','RBU'],H:['Service cost center','Others'],J:['RBU CTOS/RMA/COGS','RBU Production'],L:['Management','Others'],M:['Material','Others'],S:['Social','Others'],T:['Business Support','RBU'],V:['Selling & Marketing','RBU'],W:['Administration','RBU']};let data=structuredClone(initial).map(d=>applySapRole(d)),editing=null;function applySapRole(d){const cat=map[d.category]?.[1];d.prod=cat==='RBU Production';d.msu=cat==='MSU';d.others=cat==='Others';return d;}const columnFilters={};let activeFilterColumn=null;const $=id=>document.getElementById(id);function check(d){if(d.norole)return {type:"ok",label:"No Rule",reason:"已暫停 Rule：不檢查 100%，並標記為不納入 OPEX Calculation（POC 模擬）。"};const issue=alertFor(d);if(issue.type==='mismatch')return {type:'mismatch',label:issue.label,reason:'SAP Category 與 RBU/SBU Percentage Rule 不相符。'};const has=d.rbu!==null||d.sbu!==null;const total=(d.rbu??0)+(d.sbu??0);if(has){if(total===100)return {type:'ok',label:'已完成',reason:'RBU + SBU = 100%'};return {type:'percent',label:'比例異常',reason:`目前合計 ${total}%，${total<100?'尚差':'超過'} ${Math.abs(100-total)}%；${d.sbu===null?'SBU Percentage 未設定。':''}`};}if(d.prod||d.others||d.norole||d.msu)return {type:'ok',label:'已完成',reason:'已明確標記不需百分比的角色'};return {type:'missing',label:'未設定',reason:'尚無有效比例或非比例 Role 標記'};}function alertFor(d){if(d.norole)return {type:"ok",label:""};const cat=map[d.category]?.[1],total=(d.rbu??0)+(d.sbu??0);const hasRbu=d.rbu!==null,hasSbu=d.sbu!==null;const hasNonPercent=!!(d.prod||d.others||d.norole||d.msu);if(['MSU','Others','RBU Production'].includes(cat)&&(hasRbu||hasSbu))return {type:'mismatch',label:'Category / Rule mismatch'};/* No configured rule of any kind. A zero-percent rule still counts as configured. */if(!hasRbu&&!hasSbu&&!hasNonPercent)return {type:'missing',label:'Not set rule'};/* SAP Category's required RBU/SBU rule must exist even when another rule totals 100%. */if((cat==='RBU'&&!hasRbu)||(cat==='SBU'&&!hasSbu))return {type:'mismatch',label:'Category / Rule mismatch'};/* Non-percentage categories require the matching role; No Rule is allowed as an explicit exception. */if(cat==='MSU'&&!d.msu&&!d.norole||cat==='RBU Production'&&!d.prod&&!d.norole||cat==='Others'&&!d.others&&!d.norole)return {type:'mismatch',label:'Category / Rule mismatch'};if(hasRbu||hasSbu){if(total!==100)return {type:'percent',label:(total<100?'Short by ':'Over by ')+Math.abs(100-total)+'%'};return {type:'ok',label:''};}return {type:'ok',label:''};}function guidance(d){const a=alertFor(d);return a.label?'<span class="alert-text '+a.type+'">'+a.label+'</span>':'';}function tags(d){const cat=map[d.category]?.[1];const badge=(name,active,detail='')=>'<span class="tag '+(active?'active':'')+'">'+name+(detail?'('+detail+'%)':'')+'</span>';return [badge('RBU',!d.norole&&d.rbu!==null,d.rbu??''),badge('SBU',!d.norole&&d.sbu!==null,d.sbu??''),badge('RBU-Production',!d.norole&&!!d.prod),badge('MSU',!d.norole&&!!d.msu),badge('Others',!d.norole&&!!d.others),badge('No Rule',!!d.norole)].join(' ');}function columnValue(d,i){return ['US00','US01',d.id,d.fun,map[d.category]?.[1]||'Unknown',[d.rbu===null?'':'RBU '+d.rbu+'%',d.sbu===null?'':'SBU '+d.sbu+'%',d.prod?'RBU-Production':'',d.others?'Others':'',d.norole?'No Rule':'',d.msu?'MSU':''].join(' '),alertFor(d).label][i];}function matchColumnFilters(d){return Object.entries(columnFilters).every(([key,rule])=>{const v=columnValue(d,Number(key)).toLocaleLowerCase(),q=rule.value.toLocaleLowerCase();switch(rule.op){case 'eq':return v===q;case 'neq':return v!==q;case 'starts':return v.startsWith(q);case 'ends':return v.endsWith(q);default:return v.includes(q);}});}function render(){let arr=data.filter(d=>{const c=alertFor(d),f=$('filter').value,r=$('role').value;return (f==='all'||(f==='issue'&&['percent','missing','mismatch'].includes(c.type))||f===c.type)&&(r==='all'||(r==='RBU'&&!d.norole&&d.rbu!==null)||(r==='SBU'&&!d.norole&&d.sbu!==null)||(r==='RBU-Production'&&!d.norole&&!!d.prod)||(r==='MSU'&&!d.norole&&!!d.msu)||(r==='Others'&&!d.norole&&!!d.others)||(r==='No Rule'&&!!d.norole))&&matchColumnFilters(d);});$('rows').innerHTML=arr.map(d=>{const c=check(d),total=(d.rbu??0)+(d.sbu??0),has=d.rbu!==null||d.sbu!==null;return `<tr class="${alertFor(d).type==='ok'?'normal-row':'alert-row'}"><td>${alertFor(d).type==='ok'?'':'! '}US00</td><td>US01</td><td><strong>${d.id}</strong></td><td>${d.fun}</td><td>${map[d.category]?.[1]||'Unknown'}</td><td><button class="edit-btn" onclick="edit('${d.id}')">✎ Edit</button> ${tags(d)}</td><td>${guidance(d)}</td></tr>`}).join('')||'<tr><td colspan="7">無符合資料</td></tr>';}window.edit=id=>{editing=data.find(d=>d.id===id);$('dialogTitle').textContent='Edit — '+id;$('source').textContent=`Category: ${editing.category} (${map[editing.category]?.[1]}) · RBU 資料來自 OPEX_RBU_CC_Rate`;$('rbu').textContent=editing.rbu===null?'未設定':editing.rbu+'%';$('sbu').value=editing.sbu??'';for(const k of ['prod','others','norole','msu'])$(k).checked=!!editing[k];$('sbu').disabled=!!editing.norole;$('modal').classList.add('show');preview();};function candidate(){return {...editing,sbu:$('sbu').value===''?null:Number($('sbu').value),norole:$('norole').checked};}function preview(){if(!editing)return;$('sbu').disabled=$('norole').checked;const d=candidate(),c=check(d),total=(d.rbu??0)+(d.sbu??0);$('preview').innerHTML=`<strong class="${c.type==='ok'?'ok':'bad'} status">${c.label}</strong><p>${c.reason}</p>${c.type==='percent'&&total<100?`<div>參考補足 SBU 比例：${Math.max(0,100-(d.rbu??0))}%（僅供參考，不自動修改）</div>`:''}`;}for(const k of ['sbu','prod','others','norole','msu'])$(k).addEventListener('input',preview);$('save').onclick=()=>{const d=candidate();if(d.sbu!==null&&(d.sbu<0||d.sbu>100||!Number.isFinite(d.sbu))){alert('SBU Percentage 必須介於 0–100');return;}Object.assign(editing,d);$('modal').classList.remove('show');render();};$('cancel').onclick=()=>$('modal').classList.remove('show');$('reset').onclick=()=>{data=structuredClone(initial).map(d=>applySapRole(d));$('syncStatus').textContent='已重設';render();};$('syncDemo').onclick=()=>{const d=data.find(x=>x.id==='US-DUMMY');if(!d)return;const before=d.category;d.category=d.category==='H'?'F':'H';applySapRole(d);$('syncStatus').textContent=`US-DUMMY：SAP ${before} → ${d.category}（${map[d.category][1]}）；人工 No Rule ${d.norole?'保留':'未設定'}。可透過 Edit 設定或取消 No Rule。`;render();};const popup=$('gridFilterPopup');function closeGridFilter(){popup.hidden=true;activeFilterColumn=null;}document.querySelectorAll('.funnel').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const col=Number(btn.dataset.col);if(!popup.hidden&&activeFilterColumn===col){closeGridFilter();return;}activeFilterColumn=col;const rule=columnFilters[col];$('gridFilterOp').value=rule?.op||'eq';$('gridFilterValue').value=rule?.value||'';popup.hidden=false;const rect=btn.getBoundingClientRect();popup.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-205))+'px';popup.style.top=Math.min(rect.bottom+4,window.innerHeight-190)+'px';$('gridFilterValue').focus();}));$('gridFilterApply').onclick=()=>{if(activeFilterColumn===null)return;const value=$('gridFilterValue').value.trim();if(value)columnFilters[activeFilterColumn]={op:$('gridFilterOp').value,value};else delete columnFilters[activeFilterColumn];document.querySelectorAll('.funnel').forEach(b=>b.classList.toggle('filtered',!!columnFilters[b.dataset.col]));closeGridFilter();render();};$('gridFilterClear').onclick=()=>{if(activeFilterColumn!==null)delete columnFilters[activeFilterColumn];document.querySelectorAll('.funnel').forEach(b=>b.classList.toggle('filtered',!!columnFilters[b.dataset.col]));closeGridFilter();render();};$('gridFilterValue').addEventListener('keydown',e=>{if(e.key==='Enter')$('gridFilterApply').click();if(e.key==='Escape')closeGridFilter();});document.addEventListener('click',e=>{if(!popup.hidden&&!popup.contains(e.target)&&!e.target.closest('.funnel'))closeGridFilter();});document.querySelectorAll('input[name=roleChoice]').forEach(el=>el.addEventListener('change',()=>{$('role').value=el.value;render();}));for(const k of ['filter','role','year','month'])$(k).addEventListener('change',render);render();</script></body></html>
