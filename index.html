<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost Center Maintenance POC</title><style>body{font-family:Arial,'Microsoft JhengHei',sans-serif;background:#f3f5f8;color:#243247;margin:0}header{background:#074779;color:white;padding:18px 28px;font-size:23px}.wrap{max-width:1200px;margin:auto;padding:22px}.panel{background:white;border-radius:9px;padding:20px;margin-bottom:16px;box-shadow:0 2px 9px #d9e0e8}label{margin-right:14px}select,input,button{padding:9px;border:1px solid #cbd5e1;border-radius:5px}button{cursor:pointer;background:#0874b9;color:white;border:0}button:hover{background:#075c91}.filters{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.hint{font-size:13px;color:#607085;margin-top:10px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:12px 20px;background:#edf4fb;border-radius:8px}table{border-collapse:collapse;width:100%;background:white;font-size:14px}th{background:#084778;color:white;text-align:left;padding:12px}td{border-bottom:1px solid #e5eaf0;padding:10px}tr:hover td{background:#f5f9ff}.tag{display:inline-block;border-radius:4px;padding:4px 7px;margin:2px;background:#e6e9ef;color:#586578}.active{background:#0878bb;color:white}.warn{color:#a15b00;background:#fff0cd}.bad{color:#b42318;background:#fee4e2}.ok{color:#067647;background:#d1fadf}.status{font-weight:bold;border-radius:4px;padding:5px 9px;white-space:nowrap}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:white;padding:24px;border-radius:10px;width:min(520px,95vw);max-height:90vh;overflow:auto}.field{margin:12px 0}.field input[type=number]{width:90px}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.secondary{background:#64748b}.scroll{overflow-x:auto}.sub{font-size:12px;color:#64748b}.issue{font-size:12px;color:#a15b00;margin-top:5px}h3{margin-top:0}@media(max-width:700px){.wrap{padding:10px}th,td{padding:8px;font-size:12px}}body{background:#f2f2f2;color:#393939;font-size:14px}header{background:#e5e5e5;color:#3c3c3c;font-size:29px;font-weight:400;padding:8px 18px;border-bottom:1px solid #bbb}.wrap{max-width:none;padding:0}.panel{margin:10px 0;border:1px solid #d0d0d0;border-top:22px solid #004578;border-radius:4px;padding:16px 14px;box-shadow:0 1px 3px #bbb}.panel:nth-child(2){border-top:0;padding:8px 15px;margin-top:0}.filters{gap:16px 50px}.filters>label{font-weight:bold}select{background:linear-gradient(#fafafa,#eaeaea);border:1px solid #e7e7e7;min-width:145px;padding:7px;border-radius:3px}.role-radios{order:3;flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 4px;max-width:650px}.role-radios label{white-space:nowrap;margin-right:4px}.role-radios input{accent-color:#168ac6;margin:0 3px 0 0}.filters>label:has(#filter){order:4}.filters>#reset{order:5}button{background:#004c82;border-radius:2px;padding:6px 10px;font-weight:bold}.edit-btn{font-size:12px;padding:3px 7px;margin-right:4px}.scroll{border:1px solid #c7cdd2}th{background:#004578;font-weight:normal;padding:11px 8px;white-space:nowrap;border-right:1px solid #2e668f}td{padding:5px 8px;border-bottom:0;white-space:nowrap}tbody tr:nth-child(even) td{background:#efefef}tbody tr:nth-child(odd) td{background:white}tbody tr:hover td{background:#e0eef7}td:nth-child(-n+4){color:#d21f25}.tag{border:1px solid #e0e0e0;background:#f3f3f3;color:#999;padding:3px 5px;border-radius:2px;font-size:12px}.tag.active{background:#004578;color:white;border-color:#004578}.tag.warn{background:#fff3d5;color:#995a00}.status{font-size:12px;padding:4px 6px}.stat{background:#f3f5f7;border-radius:3px;padding:7px 15px}.hint{font-size:12px}.dialog{border-top:12px solid #004578;border-radius:3px}@media(max-width:750px){.filters{gap:10px}.role-radios{max-width:none}}</style></head><body><header>Cost Center Maintenance <span style="font-size:12px;color:#666;float:right;margin-top:8px">互動 POC · 模擬資料</span></header><main class="wrap"><section class="panel"><div class="filters"><label>Year <select id="year"><option>2026</option><option>2025</option></select></label><label>Month <select id="month"><option>10</option><option>9</option><option>8</option></select></label><label style="display:none">Role <select id="role"><option value="all">All</option><option>RBU</option><option>SBU</option><option>RBU-Production</option><option>MSU</option><option>Others</option><option>No Role</option></select></label><div class="role-radios"><label><input type="radio" name="roleChoice" value="all" checked> All</label><label><input type="radio" name="roleChoice" value="RBU"> RBU</label><label><input type="radio" name="roleChoice" value="RBU-Production"> RBU-Production</label><label><input type="radio" name="roleChoice" value="SBU"> SBU</label><label><input type="radio" name="roleChoice" value="MSU"> MSU</label><label><input type="radio" name="roleChoice" value="Others"> Others</label><label><input type="radio" name="roleChoice" value="No Role"> No Role</label></div><label>狀態 <select id="filter"><option value="all">All</option><option value="issue">異常／未完成</option><option value="percent">Non equal 100%</option><option value="missing">缺少設定</option><option value="ok">已完成</option></select></label><button id="reset">重設模擬資料</button></div><div class="hint">資料來源：Category / SAP MSU / OPEX_RBU_CC_Rate / OPEX Role Setting。所有資料皆為示意，不連線正式資料庫。</div></section><section class="panel"><div class="stats" id="stats"></div></section><section class="panel"><div class="scroll"><table><thead><tr><th>Control Area</th><th>Company Code</th><th>Cost Center</th><th>Fun Area</th><th>Category / BuType</th><th>Role of Cost Center</th><th>有效合計</th><th>設定狀態</th></tr></thead><tbody id="rows"></tbody></table></div><p class="hint">判斷規則（暫定）：有 RBU 或 SBU 比例時，合計須為 100%；沒有比例時，明確選擇非比例角色可完成。未設定和 0% 分開呈現。SAP MSU 為藍色標記且不需百分比。</p></section></main><div class="modal" id="modal"><div class="dialog"><h3 id="dialogTitle"></h3><div class="sub" id="source"></div><div class="field"><label>RBU Percentage（外部來源，唯讀） <strong id="rbu"></strong></label></div><div class="field"><label>SBU Percentage（OPEX Role Setting） <input type="number" id="sbu" min="0" max="100" step="1" placeholder="未設定"></label></div><div class="field"><label><input type="checkbox" id="prod"> RBU-Production</label></div><div class="field"><label><input type="checkbox" id="others"> Others</label></div><div class="field"><label><input type="checkbox" id="norole"> No Role</label></div><div class="field"><label><input type="checkbox" id="msu"> MSU（模擬 SAP Status）</label></div><div id="preview" class="panel" style="background:#f7fafc;box-shadow:none"></div><div class="footer"><button class="secondary" id="cancel">取消</button><button id="save">儲存模擬設定</button></div></div></div><script>
const initial=[{id:'B9NPEI',category:'E',rbu:80,sbu:null,fun:'0500'},{id:'B7FIN',category:'E',rbu:50,sbu:50,fun:'0400'},{id:'B7HR',category:'E',rbu:50,sbu:100,fun:'0400'},{id:'B7IT',category:'E',rbu:50,sbu:null,fun:'0400'},{id:'B8QUA',category:'F',rbu:null,sbu:null,msu:true,fun:'0100'},{id:'B8LAB',category:'J',rbu:null,sbu:null,prod:true,fun:'0100'},{id:'US-DUMMY',category:'H',rbu:null,sbu:null,others:true,fun:'0400'},{id:'CC-NOROLE',category:'L',rbu:null,sbu:null,norole:true,fun:'0400'},{id:'CC-EMPTY',category:'E',rbu:null,sbu:null,fun:'0400'},{id:'CC-RBU100',category:'G',rbu:100,sbu:null,fun:'0400'}];
const map={E:['R&D','SBU'],F:['MSU Production','MSU'],G:['Logistics','RBU'],H:['Service cost center','Others'],J:['RBU CTOS/RMA/COGS','RBU Production'],L:['Management','Others'],M:['Material','Others'],S:['Social','Others'],T:['Business Support','RBU'],V:['Selling & Marketing','RBU'],W:['Administration','RBU']};let data=structuredClone(initial),editing=null;const $=id=>document.getElementById(id);function check(d){const has=d.rbu!==null||d.sbu!==null;const total=(d.rbu??0)+(d.sbu??0);if(has){if(total===100)return {type:'ok',label:'已完成',reason:'RBU + SBU = 100%'};return {type:'percent',label:'比例異常',reason:`目前合計 ${total}%，${total<100?'尚差':'超過'} ${Math.abs(100-total)}%；${d.sbu===null?'SBU Percentage 未設定。':''}`};}if(d.prod||d.others||d.norole||d.msu)return {type:'ok',label:'已完成',reason:'已明確標記不需百分比的角色'};return {type:'missing',label:'未設定',reason:'尚無有效比例或非比例 Role 標記'};}function tags(d){let a=[];if(d.rbu!==null)a.push(`<span class="tag ${d.rbu>0?'active':''}">RBU ${d.rbu}%</span>`);if(d.sbu!==null)a.push(`<span class="tag active">SBU ${d.sbu}%</span>`);else if(map[d.category]?.[1]==='SBU')a.push('<span class="tag active">SBU · Category</span><span class="tag warn">% 未設定</span>');for(const [k,n] of [['prod','RBU-Production'],['others','Others'],['norole','No Role'],['msu','MSU']])if(d[k])a.push(`<span class="tag active">${n}</span>`);return a.join(' ')||'<span class="tag">未設定</span>';}function render(){let arr=data.filter(d=>{const c=check(d),f=$('filter').value,r=$('role').value;return (f==='all'||(f==='issue'&&c.type!=='ok')||(f==='percent'&&c.type==='percent')||(f==='missing'&&c.type==='missing')||(f==='ok'&&c.type==='ok'))&&(r==='all'||tags(d).includes(r));});$('rows').innerHTML=arr.map(d=>{const c=check(d),total=(d.rbu??0)+(d.sbu??0),has=d.rbu!==null||d.sbu!==null;return `<tr><td>US00</td><td>US01</td><td><strong>${d.id}</strong></td><td>${d.fun}</td><td>${d.category} / ${map[d.category]?.[1]||''}</td><td><button class="edit-btn" onclick="edit('${d.id}')">✎ Edit</button> ${tags(d)}${c.type!=='ok'?`<div class="issue">${c.reason}</div>`:''}</td><td>${has?total+'%':'不適用'}</td><td><span class="status ${c.type==='ok'?'ok':'bad'}">${c.label}</span></td></tr>`}).join('')||'<tr><td colspan="8">無符合資料</td></tr>';$('stats').innerHTML=[['總筆數',data.length],['已完成',data.filter(d=>check(d).type==='ok').length],['比例異常',data.filter(d=>check(d).type==='percent').length],['未設定',data.filter(d=>check(d).type==='missing').length]].map(([k,v])=>`<div class="stat"><div class="sub">${k}</div><strong style="font-size:23px">${v}</strong></div>`).join('');}window.edit=id=>{editing=data.find(d=>d.id===id);$('dialogTitle').textContent='Edit — '+id;$('source').textContent=`Category: ${editing.category} (${map[editing.category]?.[1]}) · RBU 資料來自 OPEX_RBU_CC_Rate`;$('rbu').textContent=editing.rbu===null?'未設定':editing.rbu+'%';$('sbu').value=editing.sbu??'';for(const k of ['prod','others','norole','msu'])$(k).checked=!!editing[k];$('modal').classList.add('show');preview();};function candidate(){return {...editing,sbu:$('sbu').value===''?null:Number($('sbu').value),...Object.fromEntries(['prod','others','norole','msu'].map(k=>[k,$(k).checked]))};}function preview(){if(!editing)return;const d=candidate(),c=check(d),total=(d.rbu??0)+(d.sbu??0);$('preview').innerHTML=`<strong class="${c.type==='ok'?'ok':'bad'} status">${c.label}</strong><p>${c.reason}</p>${c.type==='percent'&&total<100?`<div>參考補足 SBU 比例：${Math.max(0,100-(d.rbu??0))}%（僅供參考，不自動修改）</div>`:''}`;}for(const k of ['sbu','prod','others','norole','msu'])$(k).addEventListener('input',preview);$('save').onclick=()=>{const d=candidate();if(d.sbu!==null&&(d.sbu<0||d.sbu>100||!Number.isFinite(d.sbu))){alert('SBU Percentage 必須介於 0–100');return;}Object.assign(editing,d);$('modal').classList.remove('show');render();};$('cancel').onclick=()=>$('modal').classList.remove('show');$('reset').onclick=()=>{data=structuredClone(initial);render();};document.querySelectorAll('input[name=roleChoice]').forEach(el=>el.addEventListener('change',()=>{$('role').value=el.value;render();}));for(const k of ['filter','role','year','month'])$(k).addEventListener('change',render);render();</script></body></html>
